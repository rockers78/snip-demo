name: Build bundle

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# No push trigger here: GitHub evaluates push workflows from the pushed branch,
# and this file only lives on main, so it would never fire for backend/frontend/cli pushes.

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main with submodules
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: true

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build bundle
        run: node scripts/build-bundle.mjs --push